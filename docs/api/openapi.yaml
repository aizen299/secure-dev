openapi: 3.1.0

info:
  title: SecureOps API
  version: 0.3.0
  summary: Unified DevSecOps security assessment platform
  description: |
    SecureOps turns fragmented security scanner output into one contextual
    security decision.

    **This specification is part of the API contract.** An API change without a
    corresponding change here is incomplete (CLAUDE.md §18).

    ## Current state

    Phase 5 of 14. Projects and scans can be created and read, findings are
    normalized and tracked across scans, and correlation groups them into
    issues. Risk scoring, remediation, and policy endpoints arrive in later
    phases.

    **Five scanner adapters are registered: Gitleaks, Syft, Grype, Semgrep, and
    Trivy.** A repository scan therefore means secret scanning, an SBOM,
    known-vulnerability matching, static analysis, and misconfiguration
    checking. Container images and DAST are not covered: Trivy image targets
    and OWASP ZAP are not built, which is also why the `image` and `endpoint`
    correlation keys do not appear.

    ## Authentication

    Every endpoint under `/api/v1` requires a bearer token, except
    `/api/v1/health`. See the `bearerAuth` security scheme below. This is an
    **interim** measure (`docs/adr/006-interim-bearer-token-auth.md`): it
    authenticates but does not authorize. Every valid token can reach every
    project, so this is safe only for a single-tenant deployment. Phase 11
    replaces it with real identity and RBAC.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8090
    description: |
      Local development. 8090 rather than 8080 on purpose: Go binds ":8080" as
      the dual-stack wildcard, which succeeds even when another process holds
      127.0.0.1:8080, producing split-brain routing that fails silently. See
      `.env.example`.

security:
  - bearerAuth: []

tags:
  - name: operations
    description: Liveness and readiness probes for orchestrators.
  - name: projects
    description: |
      Projects are the unit of security context. Their environment,
      criticality, and internet exposure are risk-engine inputs, not
      decoration.
  - name: scans
    description: |
      Scans are asynchronous. Creation returns `202` with a scan id; progress
      is polled. The request never blocks on scanner execution.
  - name: findings
    description: |
      Canonical findings. Every scanner's output converges on this one model;
      raw scanner JSON never reaches a client.
  - name: issues
    description: |
      Correlated issues -- several findings that share one attribute, treated
      as one problem. Issues link findings, they never replace them.
  - name: risk
    description: |
      The deterministic project score. Pure function of findings, issues, and
      declared project context; no AI or heuristic influences it.
  - name: remediation
    description: |
      Ranked work. Vendor fix data is authoritative and is never embellished;
      no fix is ever invented, and no AI produces remediation content.
  - name: policy
    description: |
      The security gate. Policy is per-project data, not hardcoded thresholds,
      and an incomplete scan can never pass.

paths:
  /healthz:
    get:
      tags: [operations]
      summary: Liveness probe
      description: |
        Reports process health only. It deliberately does **not** check
        dependencies: a database outage must not cause an orchestrator to
        restart otherwise-healthy API instances.
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /readyz:
    get:
      tags: [operations]
      summary: Readiness probe
      description: |
        Probes every downstream dependency concurrently, each bounded by a
        two-second timeout so a hung backend cannot hold the endpoint open.

        Returns `503` when any dependency is unhealthy, so traffic is not routed
        to an instance that cannot serve it. Dependency errors are reported as a
        fixed string: the underlying driver error can contain hostnames and
        credentials.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Every dependency is healthy.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/v1/health:
    get:
      tags: [operations]
      summary: Versioned liveness probe
      description: The liveness payload, inside the versioned API surface.
      operationId: getApiHealth
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /api/v1/projects:
    post:
      tags: [projects]
      summary: Create a project
      description: |
        `environment`, `criticality`, and `internet_facing` are risk-engine
        inputs. They are set here rather than inferred, because a risk
        multiplier derived from a guess is a risk multiplier nobody can reason
        about.

        `slug` is derived from `name` when omitted. Unknown fields are
        rejected: silently ignoring a misspelled `criticality` would create a
        project at the default risk weight while the caller believed otherwise.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: The project was created.
          headers:
            Location:
              description: The new project's URL.
              schema: { type: string }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: A project with that slug already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}:
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/scans:
    get:
      tags: [scans]
      summary: List a project's scans
      description: |
        Newest first. Per-scanner results are omitted from list entries; fetch
        an individual scan for that detail.
      operationId: listProjectScans
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of scans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/findings:
    get:
      tags: [findings]
      summary: List a project's findings
      description: |
        The canonical findings across every scan of this project, most severe
        first, then most recently seen.

        A finding is an identity that persists across scans, not a per-scan
        record: it keeps its `id` and `fingerprint` when the code it points at
        moves, and its `status` reflects whether the latest scans still report
        it. Fetch a scan's findings instead to ask what one scan saw.
      operationId: listProjectFindings
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          description: |
            Restrict to one lifecycle state. An unrecognised value is rejected
            rather than silently matching nothing.
          schema: { $ref: "#/components/schemas/FindingStatus" }
        - name: severity
          in: query
          description: Restrict to one severity.
          schema: { $ref: "#/components/schemas/FindingSeverity" }
        - name: scanner
          in: query
          description: Restrict to findings first reported by one scanner.
          schema: { type: string }
      responses:
        "200":
          description: A page of findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/issues:
    get:
      tags: [issues]
      summary: List a project's correlated issues
      description: |
        The contextual answer, as opposed to the list of individual findings.

        An issue is several findings that share one attribute -- a
        vulnerability, a component, or a file -- treated as one problem. It is
        derived, recomputed after every scan from the project's live findings,
        and deterministic: the same findings always produce the same issues.

        Issues link findings; they never replace them. Every member carries its
        own finding id, its own severity as its scanner assessed it, and the
        evidence for its membership, so nothing is hidden behind the grouping.

        `severity` is derived from the members and may be one step above the
        worst of them when the findings span two or more domains, which
        `escalated` reports. It is a severity on the same scale as a finding's,
        **not** a risk score.
      operationId: listProjectIssues
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of correlated issues, most severe first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/risk:
    get:
      tags: [risk]
      summary: Get a project's risk score and trend
      description: |
        The single contextual number SecureOps exists to produce, computed by a
        pure deterministic engine from findings, correlated issues, and the
        project's declared context. No AI or heuristic model influences it.

        `score` runs 0 (secure) to 100 (critical) and saturates: past a point
        it stops separating projects, which is why `total` -- the aggregate
        before saturation -- is returned alongside it. A project asking "are we
        getting worse?" at the top of the scale must read `total`.

        `weights_digest` identifies the weight configuration the score was
        computed under. Weights are tunable by design, so two scores with
        different digests measure different things and a trend line drawn
        across a change is not meaningful.

        A project that has never been scored returns **404, never a score of
        zero**: "we have not assessed this" and "we assessed it and it is
        clean" are different claims, and only one is safe to act on.

        `complete` reports whether the score rests on full scanner coverage. A
        score from a `partial` scan was computed over whatever the working
        scanners found, and a failed scanner produces no findings -- which
        looks identical to an improvement. A gate must read this.

        The formula and every weight are documented in
        `docs/architecture/risk-engine.md` and ADR 019.
      operationId: getProjectRisk
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: history
          in: query
          required: false
          description: |
            How many previous scores to return in `history`, newest first. Zero
            omits the trend entirely.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 30
      responses:
        "200":
          description: The project's current risk score, with its trend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Risk"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/remediation:
    get:
      tags: [remediation]
      summary: Get a project's ranked remediation plan
      description: |
        The question a risk score raises and cannot settle: not "how bad is
        this" but "what should I do first".

        The unit is an **action**, not a finding. One upgrade may resolve
        several findings reported by several scanners, and it appears once,
        with every member retained.

        Actions are ranked by `risk_removed` -- how far the project score would
        actually fall if the action were taken, computed by rerunning the risk
        engine without that action's findings. This is deliberately not the sum
        of the members' risk: aggregation is max-dominant, so removing the
        single finding setting a project's floor can outrank clearing several
        lesser ones that sum higher.

        `fixed_versions` carries every version the vendors reported and does
        **not** choose between them. Choosing needs ecosystem-specific version
        ordering -- semver, PEP 440, Maven, Debian epochs -- and a comparator
        correct for one is wrong for another.

        Every statement carries a `source`. Per §11, AI-derived content must be
        structurally distinguishable from verified data; `ai_explanation` is
        declared for that purpose and is **never produced**, because no model
        influences remediation.

        The plan is derived on read, never stored, so an action's status cannot
        drift from its members'. See
        `docs/architecture/remediation.md` and ADR 020.
      operationId: getProjectRemediation
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project's remediation actions, most valuable first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlan"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/policy:
    get:
      tags: [policy]
      summary: Get a project's security gate configuration
      description: |
        The rules a scan is judged against. A project that has never configured
        one is gated by the default policy rather than by nothing — an absent
        policy meaning "everything passes" would make deleting a row a way to
        silently disable the gate.
      operationId: getProjectPolicy
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project's policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [policy]
      summary: Replace a project's security gate configuration
      description: |
        The most security-sensitive write in this API. Raising `max` on the
        critical-findings rule from 0 to 50 turns the gate off, so every change
        is recorded in the append-only audit log **in the same transaction as
        the change itself** — a record that could be lost while the change
        survived would leave gaps that look exactly like inaction.

        The request replaces the policy wholesale; there is no partial update,
        because a half-applied gate is not a state worth being able to reach.

        **This endpoint is authenticated and not authorized.** Every valid token
        may edit every project's policy (threat model T-23, Phase 11). The audit
        log records who changed what, not whether they were entitled to —
        detection is not prevention, and the gap is stated rather than implied.
      operationId: setProjectPolicy
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Policy" }
      responses:
        "200":
          description: The policy as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scans/{scanID}/gate:
    get:
      tags: [policy]
      summary: Get a scan's gate decision
      description: |
        `pass`, `warn`, or `fail`, with the whole of its reasoning.

        `conditions` lists **every** rule evaluated, breached or not. §12
        forbids a bare verdict, and a result carrying only breaches makes a pass
        unfalsifiable: "the project is clean" and "the policy checks nothing"
        would look identical.

        `coverage` says whether the scan had full scanner coverage. An
        incomplete scan can never produce `pass`: a scanner that crashed
        reported nothing, fewer findings breach fewer rules, and without this a
        broken scan would pass the gate precisely because it broke.

        A scan that has not been evaluated returns **404, never a pass** — "no
        gate ran" and "the gate passed" are different claims, and only one of
        them clears a change to ship.
      operationId: getScanGate
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The gate decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/findings/{findingID}/status:
    post:
      tags: [findings]
      summary: Change a finding's status
      description: |
        A human judgement about a finding: acknowledge it, start work, dismiss
        it as a false positive, accept it as a known risk, or reopen it.

        **`resolved` and `reopened` are refused with 422.** They mean "a
        scanner stopped reporting this" and "a scanner saw it again" —
        observations, not opinions. Allowing them by hand would make an
        asserted fix indistinguishable from a verified one, drop the risk
        score, and turn a failing gate green with nothing repaired. To record a
        fix a scanner cannot see, use `ignored` with a note saying why.

        Dismissing a finding lowers the project's risk score, removes its
        remediation work, and can change a gate verdict, so the change and its
        audit record are written in one transaction (ADR 024).

        Requires a `service` token. Deliberately not `admin`: gating triage
        behind admin would make weakening the policy the easier route to the
        same outcome.
      operationId: transitionFinding
      parameters:
        - $ref: "#/components/parameters/FindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: The recorded transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transition" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            A well-formed request for a transition a person may not make —
            setting `resolved` or `reopened`. Distinct from 400 on purpose: the
            request is not malformed, so retrying it unchanged will not help.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/findings/{findingID}/history:
    get:
      tags: [findings]
      summary: Get a finding's status history
      description: |
        Every transition the finding has been through, newest first, with who
        made it, when, why, and both states — §17's requirement, served rather
        than merely stored.

        Scan-driven transitions appear alongside human ones and are attributed
        to `system`: a finding became resolved because a scan stopped reporting
        it, not because anyone decided anything.
      operationId: getFindingHistory
      parameters:
        - $ref: "#/components/parameters/FindingID"
      responses:
        "200":
          description: The finding's transitions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionHistory" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scans/{scanID}/findings:
    get:
      tags: [findings]
      summary: List the findings one scan reported
      description: |
        Only findings this scan actually saw. A finding that exists in the
        project but was not reported by this scan does not appear, which is
        what distinguishes "what did this scan find" from "what is wrong with
        this project".
      operationId: listScanFindings
      parameters:
        - $ref: "#/components/parameters/ScanID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scans:
    post:
      tags: [scans]
      summary: Submit a scan
      description: |
        Returns **202 Accepted** immediately with a scan id. The request never
        blocks on scanner execution: work is dispatched to a worker through
        Redis, and progress is polled via `GET /api/v1/scans/{scanID}`.

        The target is validated here, at the API boundary, before anything is
        persisted or enqueued. Loopback, link-local, private ranges, and cloud
        metadata endpoints are rejected. The worker revalidates on arrival,
        because a payload that crossed the queue is untrusted regardless of
        which component wrote it.

        `target.kind` accepts `repository`, `image`, and `endpoint`.
        `filesystem` is **not** submittable: it means "a path inside the
        worker's workspace", an internal pipeline step, and accepting it from a
        client would turn this endpoint into a way to read the worker's disk.

        `scanners` optionally narrows the selection. Omit it to run every
        scanner that supports the target kind. Names are validated for shape
        only; an unregistered name is rejected by the worker, and the scan
        fails with `failure_reason` explaining that.
      operationId: createScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanRequest"
      responses:
        "202":
          description: |
            The scan was accepted and queued. It has not run yet, so
            `complete_coverage` is `false` and `results` is empty.
          headers:
            Location:
              description: The new scan's URL.
              schema: { type: string }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scans/{scanID}:
    get:
      tags: [scans]
      summary: Get a scan
      description: |
        Includes the per-scanner results. A scan status without that detail is
        the "clean scan" illusion the `partial` state exists to prevent, so it
        is part of the contract rather than an optional expansion.
      operationId: getScan
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The scan, with its per-scanner results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An interim static bearer token
        (`docs/adr/006-interim-bearer-token-auth.md`), configured through
        `SECUREOPS_API_TOKENS` as comma-separated `label:secret` pairs. The
        label identifies the client in the audit log.

        It authenticates; it does **not** authorize. Every valid token reaches
        every project. Tokens are compared as SHA-256 digests in constant time,
        must be at least 32 characters, and the API refuses to start without
        one. Phase 11 replaces this with real identity and RBAC.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Out-of-range values are rejected rather than clamped:
        silently returning fewer results than asked for would mislead a client
        into thinking it had the whole page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FindingID:
      name: findingID
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ScanID:
      name: scanID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    RequestId:
      description: |
        Server-generated correlation ID, 32 hex characters. A client-supplied
        `X-Request-Id` is deliberately ignored so log correlation cannot be
        poisoned by a caller.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  schemas:
    Pagination:
      type: object
      required: [limit, offset, has_more]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        has_more:
          type: boolean
          description: Whether another page follows.

    Environment:
      description: |
        Deployment context. A risk-engine input: a finding in production is not
        equivalent to the same finding in a sandbox.
      type: string
      enum: [development, staging, production]
      default: development

    Criticality:
      description: Asset criticality. A risk-engine multiplier input.
      type: string
      enum: [low, medium, high, critical]
      default: medium

    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          examples: ["Payments API"]
        slug:
          description: |
            Lowercase alphanumeric words separated by single hyphens. Derived
            from `name` when omitted.
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 1024
        environment:
          $ref: "#/components/schemas/Environment"
        criticality:
          $ref: "#/components/schemas/Criticality"
        internet_facing:
          type: boolean
          default: false

    Project:
      type: object
      required:
        [id, name, slug, description, environment, criticality,
         internet_facing, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        environment:
          $ref: "#/components/schemas/Environment"
        criticality:
          $ref: "#/components/schemas/Criticality"
        internet_facing: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        pagination:
          $ref: "#/components/schemas/Pagination"

    TargetKind:
      description: |
        What a scan points at. `filesystem` exists in the domain model but is
        not client-submittable; see `POST /api/v1/scans`.
      type: string
      enum: [repository, image, endpoint]

    TargetInput:
      description: |
        The fields used depend on `kind`: `repository_url` and optional `ref`
        for a repository, `image` for an image, `endpoint_url` for an endpoint.
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/TargetKind"
        repository_url:
          description: |
            `https` or `ssh` only. `file://` would read the worker's own
            filesystem and `git://` is unauthenticated and unencrypted, so both
            are rejected.
          type: string
          examples: ["https://github.com/acme/app"]
        ref:
          description: |
            A git ref. Leading hyphens are rejected: the value reaches a
            scanner as an argv element, where a leading `-` would be parsed as
            a flag rather than as data.
          type: string
        image:
          type: string
          examples: ["ghcr.io/acme/app:1.4.2"]
        endpoint_url:
          type: string
          examples: ["https://api.acme.example/v1"]

    Target:
      description: The stored, normalized target.
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        repository_url: { type: string }
        ref: { type: string }
        path: { type: string }
        image: { type: string }
        endpoint_url: { type: string }

    CreateScanRequest:
      type: object
      required: [project_id, target]
      additionalProperties: false
      properties:
        project_id: { type: string, format: uuid }
        repository_id:
          type: [string, "null"]
          format: uuid
        target:
          $ref: "#/components/schemas/TargetInput"
        commit_sha:
          type: string
          pattern: "^[0-9a-fA-F]{7,64}$"
          description: Lowercased before storage.
        branch:
          description: Leading hyphens and `..` are rejected.
          type: string
          maxLength: 255
        scanners:
          description: |
            Explicit adapter selection. Omit to run every scanner that supports
            the target kind. Deduplicated, lowercased, and sorted before
            storage, so an identical request always yields an identical
            selection.
          type: array
          maxItems: 32
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"

    FindingStatus:
      description: |
        `reopened` is distinct from `open`: a finding that came back after
        being resolved is a different situation from one never fixed, and a fix
        that did not hold is worth seeing.
      type: string
      enum: [open, acknowledged, in_progress, resolved, reopened, false_positive, ignored]

    FindingSeverity:
      description: |
        SecureOps' own scale. Each scanner's severity is mapped onto it and the
        original is kept in `scanner_severity`.

        `unknown` is never guessed: "we do not know" and "it does not matter"
        are different claims, so an unassessed finding sorts above `low` rather
        than below it.
      type: string
      enum: [critical, high, medium, low, info, unknown]

    Finding:
      type: object
      required:
        [id, fingerprint, category, severity, confidence, status, title,
         scanner, sources, occurrences, first_seen, last_seen]
      properties:
        id: { type: string, format: uuid }
        fingerprint:
          description: |
            The stable identity across scans. Deliberately excludes line
            numbers, titles, severities, and the scanner's name, so a finding
            keeps its identity when the code moves, when a scanner is upgraded,
            and when a second scanner reports the same problem.
          type: string
          pattern: "^[0-9a-f]{64}$"
        category:
          type: string
          enum: [sast, secrets, dependency, container, iac, dast, license]
        severity: { $ref: "#/components/schemas/FindingSeverity" }
        confidence:
          type: string
          enum: [high, medium, low]
        status: { $ref: "#/components/schemas/FindingStatus" }
        title: { type: string }
        description: { type: string }
        remediation: { type: string }
        scanner:
          description: The scanner that first reported this finding.
          type: string
        sources:
          description: |
            Every scanner that has reported it, derived from its occurrences.
            More than one means independent corroboration rather than
            duplication.
          type: array
          items: { type: string }
        scanner_severity:
          description: |
            The scanner's own severity string, verbatim. Empty when the scanner
            reports none — gitleaks does not, and SecureOps calling a committed
            credential critical is its own judgement, not the scanner's.
          type: string
        package: { type: string }
        package_version: { type: string }
        purl: { type: string }
        image:
          description: |
            The image repository a container finding was found in, with tag and
            digest deliberately stripped: `ghcr.io/org/api`, never
            `ghcr.io/org/api:1.2.3`.

            A tag would change on every build, and this value is derived from
            the same input as the finding's identity — so a tag here would make
            the field disagree with the fingerprint it came from. Absent for
            every category but `container`.
          type: string
          example: ghcr.io/org/api
        endpoint:
          description: |
            Where in a running application a DAST finding was found: the request
            method and the URL path, with the origin and query string
            deliberately absent — `GET /login`, never
            `GET https://pr-4821.preview.example.com/login?next=/home`.

            The origin is absent because it churns: a CI preview environment
            mints a new hostname per pull request, and an origin in the identity
            would resolve every finding and reopen it on the next one. What was
            scanned is recorded on the scan's target. The query string is absent
            because it is per-request noise and is where an application carries
            credentials.

            Only the path contributes to identity; the method is here for a
            reader. Absent for every category but `dast`.
          type: string
          example: GET /login
        cve:
          description: |
            The vulnerability identifier the scanner reported.

            **Known issue:** this is not always a CVE — Grype reports GHSA
            advisory ids here, so the field name overstates what it contains.
            It is a fingerprint input, so correcting it requires a deliberate
            re-fingerprinting migration and has not been done.
          type: string
        cwe: { type: string }
        cvss: { type: number, minimum: 0, maximum: 10 }
        threat:
          description: |
            Exploitation-likelihood signals. **Omitted entirely when no signal
            is available** — absence is not a low score, and a client must not
            read a missing value as "not exploited".
          allOf: [{ $ref: "#/components/schemas/ThreatIntel" }]
        occurrences:
          description: How many sightings across all scans.
          type: integer
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }

    EPSS:
      description: |
        An Exploit Prediction Scoring System value, with its provenance.

        EPSS answers a different question from CVSS: not how bad the
        vulnerability would be, but how likely anyone is to exploit it in the
        next 30 days. The two must not be multiplied — probabilities are
        genuinely small, and scaling a critical finding by 0.073 would bury it.

        Both numbers are published deliberately. `probability` is the honest
        magnitude; `percentile` is the legible one. 0.073 sounds like nothing,
        while its percentile of 0.939 says "worse than 94% of everything
        scored". A client that shows only one will mislead somebody.
      type: object
      required: [probability, percentile, source, observed_at]
      properties:
        probability:
          description: Absolute likelihood of exploitation in the next 30 days.
          type: number
          minimum: 0
          maximum: 1
        percentile:
          description: Rank among all scored vulnerabilities.
          type: number
          minimum: 0
          maximum: 1
        source:
          description: |
            Where the value reached SecureOps from, so a stale or disputed
            value can be traced. `grype` means Grype's vulnerability database
            relayed FIRST.org's model output. Never omitted: a number with no
            provenance is not evidence.
          type: string
        observed_at:
          description: |
            The EPSS model date this value came from. EPSS is recomputed daily,
            so a value without a date cannot be aged out or compared against a
            newer one.
          type: string
          format: date-time

    ThreatIntel:
      description: |
        Exploitation-likelihood signals about a finding's vulnerability. A
        container rather than a flat field: CISA KEV and CVSS v4 exploit
        maturity are expected to join `epss` as siblings.
      type: object
      properties:
        epss:
          description: Omitted when no EPSS value is available for this vulnerability.
          allOf: [{ $ref: "#/components/schemas/EPSS" }]

    FindingList:
      type: object
      required: [findings, has_more]
      properties:
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        has_more: { type: boolean }

    IssueKeyKind:
      description: |
        What an issue's members share. No further kinds are planned.

        Two further kinds were planned and both are deliberately not being
        added, now that the scanners they waited on have landed.

        `image` would be shared by every finding in one image, so the bucket
        would be the whole scan and the pairwise links would assert only what
        the finding's `image` field already states. `endpoint` would be shared
        only by DAST findings, because nothing else produces a URL path — so
        every member carries one category, and forming an issue requires two.

        Both would emit no issues. Repository and image findings are joined by
        `cve` and `purl` instead, which is where the cross-domain escalation
        comes from. "Everything in this image" and "everything on this endpoint"
        are filters on `image` and `endpoint`, not correlations.
      type: string
      enum: [cve, purl, file]

    IssueMember:
      description: |
        One finding's participation in an issue, with the evidence for it.
        `severity` is the finding's own, as its scanner assessed it -- never
        the issue's derived value.
      type: object
      required: [finding_id, fingerprint, scanner, severity, title, evidence]
      properties:
        finding_id: { type: string, format: uuid }
        fingerprint: { type: string }
        scanner: { type: string }
        severity: { $ref: "#/components/schemas/FindingSeverity" }
        title: { type: string }
        evidence:
          description: Why this finding is in this issue, in readable prose.
          type: string

    Issue:
      type: object
      required:
        [id, key_kind, key_value, severity, escalated, categories, explanation, members]
      properties:
        id: { type: string, format: uuid }
        key_kind: { $ref: "#/components/schemas/IssueKeyKind" }
        key_value:
          description: The shared value, e.g. `CVE-2026-1234` or `pkg:npm/express@4.17.1`.
          type: string
        severity:
          description: |
            Derived from the members: the worst of them, possibly raised one
            step. A severity, not a risk score.
          allOf: [{ $ref: "#/components/schemas/FindingSeverity" }]
        escalated:
          description: |
            Whether the derivation raised the severity above its worst member.
            Reported rather than left to be inferred, so a client never has to
            guess whether an issue is critical on its own merits.
          type: boolean
        categories:
          description: |
            The distinct security domains present, sorted. Two or more is what
            makes an issue cross-domain, and is the condition for escalation.
          type: array
          items: { type: string }
        explanation:
          description: The issue stated in one sentence, including why it was escalated.
          type: string
        members:
          type: array
          items: { $ref: "#/components/schemas/IssueMember" }

    IssueList:
      type: object
      required: [issues, has_more]
      properties:
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        has_more: { type: boolean }

    Risk:
      type: object
      required:
        - score
        - total
        - live_findings
        - dismissed_findings
        - scan_id
        - scan_status
        - complete
        - computed_at
        - weights_digest
        - history
      properties:
        score:
          description: |
            0 (secure) to 100 (critical). Saturating: adding findings always
            raises it, but never above 100.
          type: number
          format: double
          minimum: 0
          maximum: 100
        total:
          description: |
            The aggregate before saturation. Keeps distinguishing projects
            after `score` has flattened near 100.
          type: number
          format: double
          minimum: 0
        live_findings:
          description: Findings that counted toward the score.
          type: integer
        dismissed_findings:
          description: |
            Findings a human took out of scope -- resolved, false positive, or
            ignored. They contribute nothing to the score, and are reported so
            a low score with many dismissals is distinguishable from a low
            score with none.
          type: integer
        scan_id:
          description: |
            The scan this score was computed for. A score is a statement about
            a moment, not a standing property of the project.
          type: string
          format: uuid
        scan_status:
          description: |
            The status of the scan this score was computed for.
          $ref: "#/components/schemas/ScanStatus"
        complete:
          description: |
            Whether the score rests on full scanner coverage -- true only for a
            `completed` scan. A `partial` scan means a scanner failed and
            reported nothing, so the score is computed over less than the whole
            project, and fewer findings look exactly like an improvement. A CI
            gate must not treat an incomplete score as a passing one.
          type: boolean
        computed_at: { type: string, format: date-time }
        weights_digest:
          description: |
            Fingerprint of the weight configuration in force. Scores with
            different digests are not comparable.
          type: string
        history:
          description: Previous scores, newest first.
          type: array
          items: { $ref: "#/components/schemas/RiskPoint" }

    RiskPoint:
      type: object
      required:
        [scan_id, score, total, live_findings, scan_status, complete,
         weights_digest, computed_at]
      properties:
        scan_id: { type: string, format: uuid }
        score: { type: number, format: double, minimum: 0, maximum: 100 }
        total: { type: number, format: double, minimum: 0 }
        live_findings: { type: integer }
        scan_status: { $ref: "#/components/schemas/ScanStatus" }
        complete: { type: boolean }
        weights_digest: { type: string }
        computed_at: { type: string, format: date-time }

    RemediationPlan:
      type: object
      required: [score, addressable_findings, actions]
      properties:
        score:
          description: The project's current risk score, which the rankings are measured against.
          type: number
          format: double
        addressable_findings:
          description: |
            Live findings the plan covers. Every live finding produces work,
            even when that work is deciding what to do about something with no
            available fix.
          type: integer
        actions:
          type: array
          items: { $ref: "#/components/schemas/RemediationAction" }

    RemediationAction:
      type: object
      required:
        [kind, key, component, fixed_versions, references, risk_removed,
         score_after, statements, members]
      properties:
        kind:
          description: |
            What to do. Derived from the finding's category and fix state, never
            from the scanner that reported it. `no_fix_available` is a
            first-class action: deciding to mitigate or accept is work someone
            has to do, and hiding those findings would drop the ones most
            likely to need a compensating control.
          type: string
          enum:
            [upgrade, no_fix_available, rotate_credential, reconfigure,
             change_code, review_license]
        key:
          description: Stable identity, derived from what is acted on rather than from any finding id.
          type: string
        component:
          description: The affected component, which §11 requires every recommendation to identify.
          type: string
        fixed_versions:
          description: |
            Every version the members' vendors reported as fixing them.
            SecureOps does not choose between them.
          type: array
          items: { type: string }
        references:
          description: Advisory and documentation links, which are where to read about a finding rather than what to do.
          type: array
          items: { type: string }
        risk_removed:
          description: |
            How far the project score would fall if this action were taken.
            The ranking signal, exposed rather than implied.
          type: number
          format: double
          minimum: 0
        score_after:
          description: The project score that would remain.
          type: number
          format: double
        statements:
          type: array
          items: { $ref: "#/components/schemas/RemediationStatement" }
        members:
          description: Every finding this action would resolve, individually queryable.
          type: array
          items: { $ref: "#/components/schemas/RemediationMember" }

    RemediationStatement:
      type: object
      required: [source, text]
      properties:
        source:
          description: |
            Where the claim came from. `vendor` is an advisory or vendor claim
            and is authoritative; `scanner` is the scanner without vendor
            backing; `derived` is SecureOps computing deterministically from
            those. `ai_explanation` is declared so AI content would be visible
            if it were ever added, and is never produced.
          type: string
          enum: [vendor, scanner, derived, ai_explanation]
        text: { type: string }

    RemediationMember:
      type: object
      required: [fingerprint, scanner, severity, title, risk]
      properties:
        fingerprint: { type: string }
        scanner: { type: string }
        severity: { $ref: "#/components/schemas/FindingSeverity" }
        title: { type: string }
        risk:
          description: This finding's own risk score, so a reader can see which member dominates the action.
          type: number
          format: double

    Policy:
      type: object
      required: [rules, incomplete_scan]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/PolicyRule" }
        incomplete_scan:
          description: |
            How a scan that did not complete is treated. `pass` is not a value:
            §12 and §13 both forbid reading a partial scan as a clean one.
          type: string
          enum: [warn, fail]

    PolicyRule:
      type: object
      required: [kind, max, level]
      properties:
        kind:
          description: |
            What the rule measures. `kind` plus `selector` rather than one
            constant per metric, so a new severity or category needs no API
            change. The vocabulary is the canonical model's own — a policy says
            "no critical findings", never "no Gitleaks findings".
          type: string
          enum: [severity_count, category_count, risk_score]
        selector:
          description: |
            The severity or category counted. Omitted for `risk_score`, which
            measures the project rather than a subset of it.
          type: string
        max:
          description: |
            The ceiling. A rule breaches when the observed value **exceeds** it,
            so 0 means "none allowed" and a value equal to the limit passes.

            For `risk_score` this is a maximum, not the minimum §25 of the
            specification writes. Against §10's 0-secure-to-100-critical scale a
            minimum would fail secure projects and pass catastrophic ones; ADR
            021 records the reinterpretation.
          type: number
          format: double
          minimum: 0
        level:
          description: What a breach produces. Configured per rule, so the same rule can warn for one team and fail for another.
          type: string
          enum: [warn, fail]

    GateResult:
      type: object
      required: [verdict, conditions, coverage, summary, scan_id, evaluated_at]
      properties:
        verdict:
          type: string
          enum: [pass, warn, fail]
        conditions:
          description: Every rule evaluated, breached or not.
          type: array
          items: { $ref: "#/components/schemas/GateCondition" }
        coverage: { $ref: "#/components/schemas/GateCoverage" }
        summary:
          description: |
            The human-readable rendering, for a pull-request comment or a
            dashboard. Derived from the same conditions as the machine-readable
            form, so the two cannot disagree.
          type: string
        scan_id: { type: string, format: uuid }
        evaluated_at: { type: string, format: date-time }

    GateCondition:
      type: object
      required: [kind, max, level, observed, breached, explanation]
      properties:
        kind: { type: string, enum: [severity_count, category_count, risk_score] }
        selector: { type: string }
        max: { type: number, format: double }
        level: { type: string, enum: [warn, fail] }
        observed: { type: number, format: double }
        breached: { type: boolean }
        explanation: { type: string }

    GateCoverage:
      type: object
      required: [complete, scan_status, downgraded]
      properties:
        complete:
          description: Whether the scan finished with full scanner coverage.
          type: boolean
        scan_status: { $ref: "#/components/schemas/ScanStatus" }
        downgraded:
          description: |
            Whether incompleteness made the verdict worse. Lets a WARN caused
            by a crashed scanner be told apart from one caused by a breached
            rule, which need different responses.
          type: boolean

    TransitionRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          description: |
            The state to move to. `resolved` and `reopened` are absent because
            they are scan-driven observations, not judgements.
          type: string
          enum: [open, acknowledged, in_progress, false_positive, ignored]
        reason:
          description: |
            Why, from a fixed vocabulary so it stays queryable — "everything
            dismissed as an accepted risk this quarter" is a question a
            security team asks, and free text cannot answer it.
          type: string
          enum: [false_positive, accepted_risk, triaged, work_started, reinstated]
        note:
          description: |
            The argument behind the judgement. Optional, and the place the
            actual reasoning goes: `accepted_risk` alone does not tell the next
            reader what was accepted or on whose authority.
          type: string
          maxLength: 2000

    Transition:
      type: object
      required: [finding_id, from_status, to_status, actor, reason, changed_at]
      properties:
        finding_id: { type: string, format: uuid }
        from_status: { $ref: "#/components/schemas/FindingStatus" }
        to_status: { $ref: "#/components/schemas/FindingStatus" }
        actor:
          description: |
            Who made the change. A token label rather than a person: the
            interim credential identifies a client, and recording it as a user
            would claim an attribution the authentication model cannot support
            (ADR 006, ADR 023). `system` for scan-driven transitions.
          type: string
        reason: { type: string }
        note: { type: string }
        changed_at: { type: string, format: date-time }

    TransitionHistory:
      type: object
      required: [transitions]
      properties:
        transitions:
          type: array
          items: { $ref: "#/components/schemas/Transition" }

    ScanStatus:
      description: |
        `partial` is distinct from `completed` and is never a synonym for it. A
        scan in which any scanner failed, was skipped, or reported a
        degradation must never be reported as a clean, complete scan.
      type: string
      enum: [queued, running, partial, completed, failed, cancelled]

    ScannerResult:
      type: object
      required: [scanner, status, exit_code, duration_ms, degradations]
      properties:
        scanner: { type: string, examples: ["gitleaks"] }
        status:
          description: |
            `skipped` means the scanner never ran, usually because its binary is
            absent. Absent coverage and broken coverage need different operator
            responses, so they are distinct.
          type: string
          enum: [pending, running, succeeded, failed, skipped]
        version:
          description: |
            The scanner binary version. Results are only reproducible relative
            to it.
          type: string
        exit_code: { type: integer }
        duration_ms: { type: integer }
        error:
          description: |
            A fixed, non-sensitive summary. Never raw scanner stderr, which can
            quote repository content and detected secret values.
          type: string
        degradations:
          description: |
            Why this scanner's coverage cannot be fully trusted, even though it
            ran. A non-empty array means the findings are an under-count, so the
            scan is `partial` and a gate must not read it as clean.

            Deliberately a set of reasons rather than a single flag or status: a
            gate has to explain the exact conditions behind its verdict, and
            "degraded" on its own is not actionable. The vocabulary is open --
            each scanner adapter names its own reasons, so clients must treat an
            unrecognised value as degraded rather than ignoring it. See ADR 010.
          type: array
          items: { type: string }
          examples: [["output_truncated"]]
        started_at: { type: string, format: date-time }

    Scan:
      type: object
      required:
        [id, project_id, status, target, requested_scanners,
         complete_coverage, degraded_scanners, results, queued_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        repository_id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/ScanStatus"
        target:
          $ref: "#/components/schemas/Target"
        commit_sha:
          description: |
            The revision that was actually scanned. For a repository target
            this is resolved from the checkout, not echoed from the request:
            a request names a URL and at most a ref, and a ref moves. Empty
            until the fetch completes, and empty for target kinds that have no
            revision.
          type: string
        branch:
          description: |
            The branch that was actually checked out, which is not always the
            one that was asked for: a request with no ref lands on whatever the
            remote calls its default. Falls back to the requested ref when the
            checkout is detached, since a detached HEAD is not on a branch.

            `commit_sha` is the authoritative record of what was examined; this
            is the human-readable label for it, and it cannot be recovered
            afterwards because branches move and are deleted.
          type: string
        requested_scanners:
          description: |
            What was asked for. Empty means "every scanner supporting the
            target kind". Kept separate from `results`, which is what actually
            ran.
          type: array
          items: { type: string }
        complete_coverage:
          description: |
            `false` whenever any scanner failed, was skipped, or reported a
            degradation.
            A gate evaluated against degraded coverage must be labelled as
            such, so this is computed server-side rather than left for each
            client to re-derive.
          type: boolean
        degraded_scanners:
          type: array
          items: { type: string }
        failure_reason:
          description: |
            Why a scan reached a terminal state without usable results. One of
            a closed set of fixed strings, never an underlying error.
          type: string
          examples: ["no registered scanner supports this target kind"]
        results:
          type: array
          items:
            $ref: "#/components/schemas/ScannerResult"
        queued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    ScanList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        pagination:
          $ref: "#/components/schemas/Pagination"

    LivenessResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          examples: ["secureops-api"]
        version:
          type: string
          description: Build version, injected at link time.
          examples: ["dev"]

    ReadinessResponse:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyState"

    DependencyState:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          examples: ["postgres", "redis"]
        status:
          type: string
          enum: [ok, unavailable]
        error:
          type: string
          description: |
            A fixed, non-sensitive summary. Never the driver error, which can
            contain host and credential detail.
          examples: ["dependency check failed"]

    ErrorEnvelope:
      description: |
        The single error shape returned by every endpoint. CI clients and the
        dashboard branch on `code`, so it is part of the API contract.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - not_found
                - method_not_allowed
                - internal_error
                - service_unavailable
                - unauthenticated
                - invalid_request
                - conflict
                - payload_too_large
                - unsupported_media_type
            message:
              type: string
              description: |
                A fixed, non-sensitive string. Internal failure detail stays in
                the logs, and attacker-supplied input is never echoed back.
            request_id:
              type: string
              pattern: "^[0-9a-f]{32}$"

  responses:
    Forbidden:
      description: |
        The credential is valid but not privileged enough. Tokens carry a role
        — `viewer`, `service`, or `admin` — and editing a security policy
        requires `admin`, so the credential CI uses to submit scans cannot
        switch off the gate judging it (ADR 023).

        Distinct from 401 on purpose: the caller authenticated successfully, and
        hiding that would be security through obscurity while making a
        misconfigured client look like a broken deployment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: |
        The credential was missing, malformed, or unrecognised. The three are
        deliberately not distinguished.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: A `Bearer` challenge, carrying no detail about the failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InvalidRequest:
      description: |
        A malformed body or a failed field validation. The message names the
        rule that was broken; it never echoes the value that broke it, because
        that value is attacker-controlled and reaches the logs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    PayloadTooLarge:
      description: The request body exceeded the configured cap.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    UnsupportedMediaType:
      description: The request body was not `application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    MethodNotAllowed:
      description: The method is not supported for this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InternalError:
      description: An unexpected failure occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
