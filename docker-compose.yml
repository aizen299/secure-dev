# SecureOps local development stack.
#
# Credentials are read from a local .env file, which is gitignored (§15.2).
# There are no default passwords here on purpose: compose fails loudly if a
# value is missing rather than silently starting with a known-weak credential.

name: secureops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-secureops}
    # Bound to loopback: the development database must not be reachable from
    # the local network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see .env.example}
      - --save
      - ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  migrate:
    image: secureops-app:latest
    build:
      context: .
      dockerfile: deployments/docker/api.Dockerfile
    entrypoint: ["/usr/local/bin/migrate", "-dir", "/migrations", "up"]
    environment:
      SECUREOPS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secureops}?sslmode=disable
      SECUREOPS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: secureops-app:latest
    build:
      context: .
      dockerfile: deployments/docker/api.Dockerfile
    environment:
      SECUREOPS_ENV: development
      SECUREOPS_HTTP_ADDR: ":8080"
      SECUREOPS_LOG_LEVEL: ${SECUREOPS_LOG_LEVEL:-info}
      SECUREOPS_LOG_FORMAT: ${SECUREOPS_LOG_FORMAT:-json}
      SECUREOPS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secureops}?sslmode=disable
      SECUREOPS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Interim bearer credentials (ADR 006), as comma-separated label:secret
      # pairs. Required with no default, like the passwords above: the API
      # refuses to start without one rather than coming up unauthenticated.
      SECUREOPS_API_TOKENS: ${SECUREOPS_API_TOKENS:?SECUREOPS_API_TOKENS is required, see .env.example}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    # A separate image from the API on purpose: the worker needs git and the
    # scanner binaries, and the API must never have them (§14.1).
    image: secureops-worker:latest
    build:
      context: .
      dockerfile: deployments/docker/worker.Dockerfile
    volumes:
      # The vulnerability database, provisioned once at startup and reused by
      # every job (ADR 012). Named rather than bind-mounted so it survives
      # container replacement -- a 2 GB re-download per restart is not viable.
      - grype-db:/var/cache/grype/db
      # Semgrep's provisioned rules and its own state, fetched once at startup
      # (ADR 014). Named so they survive container replacement.
      - semgrep-rules:/var/cache/semgrep
      # Trivy's misconfiguration checks bundle, fetched once at startup
      # (ADR 015). ~2.6 MB, unlike grype's 2 GB.
      - trivy-checks:/var/cache/trivy
    environment:
      SECUREOPS_ENV: development
      SECUREOPS_LOG_LEVEL: ${SECUREOPS_LOG_LEVEL:-info}
      SECUREOPS_LOG_FORMAT: ${SECUREOPS_LOG_FORMAT:-json}
      SECUREOPS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secureops}?sslmode=disable
      SECUREOPS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECUREOPS_WORKER_CONCURRENCY: ${SECUREOPS_WORKER_CONCURRENCY:-2}
      SECUREOPS_WORKSPACE_ROOT: /workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The worker unpacks untrusted repository content, so its writable surface
    # is a single tmpfs workspace and nothing else (CLAUDE.md §14.3).
    read_only: true
    # uid/gid must match the image's nonroot user (65532). Without them the
    # tmpfs is owned by root, the non-root worker cannot create a workspace,
    # and every scan fails at the fetch step.
    tmpfs:
      - /workspaces:mode=0700,uid=65532,gid=65532,size=2g
      # ZAP's home: its config, its session database, and the report a scan
      # writes (ADR 030). A tmpfs rather than a named volume because, unlike
      # grype's database, there is nothing to download and nothing worth
      # keeping -- ZAP's passive rules ship inside the installation, so this
      # directory is rebuilt at startup in under a second.
      - /var/cache/zap:mode=0700,uid=65532,gid=65532,size=512m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deployments/docker/web.Dockerfile
    environment:
      SECUREOPS_API_URL: http://api:8080
      # The dashboard's own credential. It reads the API server-side and never
      # exposes this to the browser (ADR 027), so it belongs here rather than
      # in any NEXT_PUBLIC_ variable -- which would ship it to every visitor.
      #
      # This is the SECRET alone: the third field of a label:role:secret entry
      # in SECUREOPS_API_TOKENS, not the whole triple.
      #
      # A `service` role since ADR 029, because the URL bar submits scans.
      # Deliberately not `admin`: the dashboard must not be able to edit the
      # policy that judges the scans it queues. A `viewer` secret still works
      # for a deployment that wants the ADR 027 read-only posture -- the URL
      # bar then reports the API's own 403 rather than failing quietly.
      SECUREOPS_API_TOKEN: ${SECUREOPS_DASHBOARD_TOKEN:-}
      # No SECUREOPS_DASHBOARD_PASSWORD, and no cookie signing key. Both were
      # ADR 029's shared-password login; people sign in with accounts now, and
      # the session is the API's own token (ADR 033). The dashboard refuses to
      # start if the password variable is still set, rather than ignoring it.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
  grype-db:
  semgrep-rules:
  trivy-checks:
