{{- if not .Values.secrets.existingSecret }}
{{- /*
  Every value is required. The chart refuses to render rather than defaulting,
  which is the same line docker-compose.yml holds with `${VAR:?}`: a default
  credential is a known-weak credential that every deployment inherits and
  nobody notices (§15.1).

  A real deployment should set `secrets.existingSecret` and manage these
  through whatever holds its secrets, so they never pass through a values file.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureops.secretName" . }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword is required (or set secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  redis-password: {{ required "secrets.redisPassword is required (or set secrets.existingSecret)" .Values.secrets.redisPassword | quote }}
  api-tokens: {{ required "secrets.apiTokens is required (or set secrets.existingSecret) — comma-separated label:role:scope:secret entries" .Values.secrets.apiTokens | quote }}
  {{- if .Values.web.enabled }}
  dashboard-token: {{ required "secrets.dashboardToken is required when web.enabled (or set secrets.existingSecret)" .Values.secrets.dashboardToken | quote }}
  {{- end }}
{{- end }}
